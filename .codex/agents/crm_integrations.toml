внешняя операция ещё выполняется. Короткая реплика начала обработки допустима
только с честным последующим результатом.
Ключи остаются серверными. Не выводи .env или данные клиентов. Доступ и
разрешения среды не расширяй. Живые операции в CRM координирует основной агент
в пределах поручения пользователя; по умолчанию проверяй локально.
Результат: контракт, изменённые файлы, проверка повторов и ошибок,
подтверждённый статус подключения и оставшиеся данные от заказчика.
'''
